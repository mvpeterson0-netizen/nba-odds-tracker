name: Check NBA key balances
on:
  push:
    branches: [fix/free-keys-before-paid]
    paths: [.github/workflows/check-key-balances.yml]
permissions:
  contents: read
jobs:
  balances:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Free balance checks only
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          ODDS_API_KEY_20K: ${{ secrets.ODDS_API_KEY_20K }}
        shell: python
        run: |
          import os, urllib.request, urllib.parse, urllib.error
          for name in ["ODDS_API_KEY","ODDS_API_KEY_2","ODDS_API_KEY_3","ODDS_API_KEY_4","ODDS_API_KEY_5","ODDS_API_KEY_6","ODDS_API_KEY_20K"]:
              key = os.environ.get(name, '').strip()
              if not key:
                  print(name + ': NOT CONFIGURED')
                  continue
              url = 'https://api.the-odds-api.com/v4/sports/basketball_nba/events?' + urllib.parse.urlencode({'apiKey':key})
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      print(name + ': remaining=' + r.headers.get('x-requests-remaining','unknown') + ', used=' + r.headers.get('x-requests-used','unknown'))
              except urllib.error.HTTPError as e:
                  print(name + ': HTTP ' + str(e.code))
              except Exception:
                  print(name + ': connection failed')
